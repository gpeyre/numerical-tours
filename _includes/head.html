<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  <meta name="theme-color" content="#12243a">
  <title>{% if page.title and page.title != 'Numerical Tours' %}{{ page.title | escape }} · {% endif %}Numerical Tours</title>
  <link rel="canonical" href="{{ page.url | replace: 'index.html', '' | absolute_url }}">
  <link rel="icon" type="image/png" href="{{ '/img/favicon.png' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/tours.css' | relative_url }}">
</head>
